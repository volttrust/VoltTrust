# message sent to a panel owner when a dust alert notifies automatically
owner_message:
  dust:
    en: "Hello, your solar panels are producing about {loss}% less than nearby panels, which usually means dust. A gentle rinse with water, when the panels are cool, normally brings the output back. No need to contact us unless it stays low."
    fr: "Bonjour, vos panneaux solaires produisent environ {loss} % de moins que les panneaux voisins, ce qui indique généralement de la poussière. Un rinçage doux à l'eau, panneaux froids, rétablit normalement la production. Inutile de nous contacter, sauf si elle reste faible."

